name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/canoe-ci.db
      RELEASE_DIR: /tmp/canoe-ci-releases
      SECRET_KEY: ci-review-secret
      ADMIN_USERNAME: ciadmin
      ADMIN_PASSWORD: CI-Admin-Pass-123
      PUBLIC_BASE_URL: http://127.0.0.1:8765
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install -q -U pip
          python -m pip install -q -e canoe-core -r canoe-server/requirements.txt "httpx>=0.27,<1"
      - name: Static checks
        run: |
          python -m compileall -q canoe-core canoe-server canoe-client
          node --check canoe-server/panel/app.js
          node --check canoe-server/panel/boot.js
      - name: Unit and hardening tests
        working-directory: canoe-server
        run: |
          python test_hardening.py
          python test_release.py
          python test_broadcast.py
      - name: Deployment script tests
        run: bash canoe-server/deploy/test_canoe_sh.sh
      - name: End-to-end smoke
        working-directory: canoe-server
        run: |
          rm -f /tmp/canoe-ci.db /tmp/canoe-ci.db-wal /tmp/canoe-ci.db-shm
          python seed.py
          python serve.py --port 8765 --no-tls >/tmp/canoe-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null; then break; fi
            sleep 1
          done
          python smoke_test.py http://127.0.0.1:8765

  client:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install -q -U pip
          python -m pip install -q -e canoe-core -r canoe-client/requirements.txt
          python -m pip install -q "httpx>=0.27,<1"
      - name: Client regression suite
        shell: bash
        working-directory: canoe-client
        run: |
          python tests/test_links.py
          python tests/test_config.py
          python tests/test_tools.py
          python tests/test_update.py
          python tests/test_remember.py
          python tests/test_sysproxy.py
          python tests/test_gui.py
