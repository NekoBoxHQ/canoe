<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>轻舟 · 管理面板</title>
<!--
  轻舟 / Canoe 管理面板

  纯静态，无构建步骤，**不引任何外部 CDN** —— 一个代理服务的管理后台
  不该在打开时去 ping 第三方，也免得离线/内网环境用不了。
  所有资源都在这个目录里。

  登录复用 /api/login，拿到的是同一个管理员令牌；
  权限由服务端 /api/admin/* 二次校验，前端藏不藏都没用。
-->
<!-- 文件名从 logo.png 改成 favicon.png 是有意的：Chrome 的 favicon 单独存
     一个库、按 URL 缓存，且**不老实听 Cache-Control** —— 同一个 URL 换了图，
     无痕窗口都可能还给你看旧的（真踩过）。换个新文件名（= 新 URL）才能
     让所有浏览器立刻重取。以后换图标，**换文件内容还不够，要么改名要么加 ?v=n**。 -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script>
/* 有令牌就别让登录框露脸 —— 验令牌要一个网络来回，那段时间先显示
   一枚加载条（见 #boot-screen 的说明）。放在这里、而不是 app.js 里，
   是为了赶在浏览器第一次绘制之前把类打上：app.js 里做的话，
   登录框已经画出来了，还是闪一下。 */
try {
  if (sessionStorage.getItem('canoe.panel.token')) {
    document.documentElement.classList.add('booting');
  }
} catch (e) { /* 无痕模式禁 sessionStorage：那就照常显示登录框 */ }
</script>
</head>
<body>

<!--
  ================= 启动 =================
  有令牌时先显示这个，等 /api/me 验完再决定进后台还是回登录页。

  没有它的话，刷新时会先闪一下登录框：HTML 里 #login-screen 默认就
  是可见的，而验令牌要一个来回，那几十到几百毫秒里用户看到的是
  "我掉线了？"，然后卡片才消失。
-->
<div id="boot-screen" class="screen">
  <!--
    ⚠ 这里用的是 logo-full.png，**favicon 用的是 favicon.png** —— 两张不同的图，
      别再合并成一个文件：
        · logo-full.png  带「CANOE / LIGHT BOAT」字样的完整品牌图，只在
                         这种**大图**位置用（96px 才认得出字）
        · favicon.png    客户端那条船（透明底、无字），给 16~32px 的浏览器
                         标签用 —— 带字的缩到那个尺寸就是一坨。
                         这张跟 canoe-client/assets/canoe.png 是同一个文件，
                         换了图标记得两边一起换。
  -->
  <img class="boot-logo" src="logo-full.png" alt="">
  <div class="boot-text">轻舟 · 正在验证登录状态</div>
  <div class="boot-bar"></div>
</div>

<!-- ================= 登录 ================= -->
<!--
  背景是**代码画的**（内联 SVG）：夜空 + 月亮 + 两层山脊 + 水面 + 月光柱，
  跟客户端那套夜色是一回事 —— 打开面板和打开客户端，看着得是同一个产品。

  为什么画 SVG 而不是放一张背景图：面板是纯静态、不引外部资源的（见文件头），
  一张大图等于多一个要传、要缓存、还可能失真的文件；而且它得跟着窗口缩放。
  inline SVG 自带 viewBox，怎么拉都不糊。
-->
<div id="login-screen" class="screen">
  <div class="login-scene" aria-hidden="true">
    <svg viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#050a16"/>
          <stop offset="0.55" stop-color="#081428"/>
          <stop offset="1" stop-color="#0a1a34"/>
        </linearGradient>
        <radialGradient id="halo">
          <stop offset="0" stop-color="#e4eeff" stop-opacity="0.34"/>
          <stop offset="0.45" stop-color="#9dc4ff" stop-opacity="0.12"/>
          <stop offset="1" stop-color="#9dc4ff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0a1c38"/>
          <stop offset="1" stop-color="#040d1e"/>
        </linearGradient>
        <!-- 月光落在水面上那道柱。
             ⚠ 别做成一块实心梯形：第一版就是这么干的（0.15 的白蓝），
               渲染出来是**一条灰色马路**，比没有还难看。要让它像光，
               得靠"边缘化开 + 越往下越淡"：横向也在渐变里收窄，
               再叠几道碎光。 -->
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#cfe0ff" stop-opacity="0.10"/>
          <stop offset="0.35" stop-color="#bcd4ff" stop-opacity="0.06"/>
          <stop offset="1" stop-color="#9dc4ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="beam-fade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity="1"/>
          <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
          <stop offset="1" stop-color="#000" stop-opacity="1"/>
        </linearGradient>
        <mask id="beam-mask">
          <rect x="1030" y="700" width="170" height="120" fill="url(#beam-fade)"/>
        </mask>
      </defs>

      <rect width="1440" height="820" fill="url(#sky)"/>
      <circle cx="1112" cy="196" r="260" fill="url(#halo)"/>
      <circle cx="1112" cy="196" r="42" fill="#e4eeff" opacity="0.9"/>

      <!-- 星：坐标写死，别用随机 —— 每次打开得是同一片天 -->
      <g fill="#e4eeff">
        <circle cx="180" cy="120" r="1.4" opacity=".5"/><circle cx="330" cy="70" r="1.1" opacity=".35"/>
        <circle cx="520" cy="160" r="1.6" opacity=".55"/><circle cx="700" cy="90" r="1.1" opacity=".3"/>
        <circle cx="880" cy="140" r="1.3" opacity=".45"/><circle cx="1250" cy="80" r="1.5" opacity=".5"/>
        <circle cx="1360" cy="220" r="1.2" opacity=".35"/><circle cx="60" cy="240" r="1.2" opacity=".3"/>
        <circle cx="980" cy="60" r="1" opacity=".25"/><circle cx="430" cy="250" r="1" opacity=".28"/>
      </g>

      <!-- 远山（淡）与近山（深），上沿压一道月光边 -->
      <path id="ridge-far" d="M0 596 L150 520 L300 574 L470 480 L640 566 L820 496 L980 570 L1160 512 L1300 578 L1440 540 L1440 820 L0 820 Z"
            fill="#12355f" opacity="0.55"/>
      <use href="#ridge-far" fill="none" stroke="#2f6ba8" stroke-width="1.6" opacity="0.5"/>
      <path id="ridge-near" d="M0 676 L200 598 L400 662 L600 566 L800 664 L1000 604 L1200 678 L1440 626 L1440 820 L0 820 Z"
            fill="#081a33"/>
      <use href="#ridge-near" fill="none" stroke="#3d7cbd" stroke-width="1.6" opacity="0.45"/>

      <rect y="700" width="1440" height="120" fill="url(#water)"/>
      <g mask="url(#beam-mask)">
        <polygon points="1074,700 1150,700 1180,820 1044,820" fill="url(#beam)"/>
      </g>
      <g stroke="#8fb6e8" stroke-width="1.2" opacity="0.16">
        <line x1="1080" y1="726" x2="1146" y2="726"/>
        <line x1="1072" y1="748" x2="1154" y2="748" opacity=".8"/>
        <line x1="1062" y1="770" x2="1164" y2="770" opacity=".6"/>
        <line x1="240" y1="742" x2="470" y2="742" opacity=".5"/>
        <line x1="620" y1="762" x2="880" y2="762" opacity=".45"/>
      </g>
    </svg>
  </div>

  <form id="login-form" class="login-card" autocomplete="on">
    <div class="login-head">
      <span class="login-id">
        <h1>轻舟</h1>
        <small>CANOE SERVER</small>
      </span>
    </div>

    <div class="login-hr"></div>

    <label class="field">
      <span>管理员账号</span>
      <input id="login-user" name="username" type="text" autocomplete="username"
             placeholder="admin" required>
    </label>
    <label class="field">
      <span>管理员密码</span>
      <input id="login-pass" name="password" type="password"
             autocomplete="current-password" placeholder="••••••••" required>
    </label>

    <div id="login-error" class="login-error" hidden></div>

    <button class="btn btn-primary" type="submit" id="login-btn">登 录</button>
  </form>

  <p class="login-foot">轻舟已过万重山</p>
</div>

<!-- ================= 主界面 ================= -->
<div id="app-screen" class="screen" hidden>
  <aside class="sidebar">
    <!-- 这里原来还有个 logo 徽标，用户让去掉了（"徽标都要"→不要）——
         跟登录卡一样：两行字认得出来就够了。logo 现在只在 favicon 上。 -->
    <div class="brand">
      <div>
        <strong>轻舟</strong>
        <small>Canoe Server</small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="whoami" class="whoami"></div>
      <button class="btn btn-ghost btn-block" id="logout-btn">退出</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="page-title">概览</h2>
      <div class="topbar-right">
        <span id="health-dot" class="dot" title="服务端状态"></span>
        <button class="btn btn-ghost" id="refresh-btn">刷新</button>
      </div>
    </header>
    <section id="page" class="page"></section>
    <!-- 底部版本号。跟客户端底下那行一个意思：报问题时第一句常常是
         "我装的是哪个版本"。数从 /api/health 来（服务端自己的版本），
         面板里不写死 —— 写死迟早跟服务端对不上。 -->
    <footer class="app-version" id="app-version"></footer>
  </main>
</div>

<!-- 弹窗 / 提示 -->
<div id="modal-root" class="modal-root" hidden>
  <div class="modal-mask"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="btn-icon" id="modal-close" aria-label="关闭">✕</button>
    </header>
    <div id="modal-body" class="modal-body"></div>
    <footer class="modal-foot">
      <button class="btn btn-ghost" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-ok">确定</button>
    </footer>
  </div>
</div>
<div id="toasts" class="toasts"></div>

<script src="app.js"></script>
</body>
</html>
