# 轻舟 / Canoe Server —— Nginx 站点示例
#
# 安装：
#   sudo cp deploy/nginx.canoe.conf /etc/nginx/sites-available/canoe
#   sudo ln -sf /etc/nginx/sites-available/canoe /etc/nginx/sites-enabled/canoe
#   sudo certbot --nginx -d api.canoe.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# 三处**不能省**的设置，省了就出问题：
#   1. /api/events        proxy_buffering off      否则推送被缓冲，客户端收不到实时事件
#   2. /api/events        proxy_read_timeout 3600s 默认 60s 会把长连接掐断
#   3. /downloads/ 与上传  client_max_body_size     不放宽的话传大安装包 413

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.canoe.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.canoe.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.canoe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.canoe.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 客户端只走 HTTPS，那就把它焊死
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 根路径装作一个普通站点，别把 /docs 暴露给扫描器
    location = / {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------------------
    # 推送：SSE 长连接
    # ------------------------------------------------------------------
    location /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 这条连接要一直挂着，别让 Nginx 收走
        proxy_set_header Connection "";

        # ★ 关键：不缓冲，否则事件会攒在缓冲区里，客户端迟迟收不到
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # ★ 默认 60s 会掐断长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # 安装包下载（服务端自托管）
    # ------------------------------------------------------------------
    location /downloads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 安装包几十 MB，别在这个 location 上限制小了
        client_max_body_size 512m;
        # 大文件走磁盘缓冲，省内存
        proxy_buffering on;
        proxy_max_temp_file_size 1024m;
    }

    # ------------------------------------------------------------------
    # API
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 管理端上传安装包走的是 /api/admin/releases/upload
        client_max_body_size 512m;
        proxy_read_timeout 120s;
    }

    # 生产环境别把 /docs /redoc 开在公网
    location /docs   { return 404; }
    location /redoc  { return 404; }
    location /openapi.json { return 404; }
}

# ======================================================================
# 中转层（relay）是另一台机器 / 另一个域名，配置见 relay/nginx.example.conf
#
# 如果中转层和 API 在同一台机器上，可以合成一个 server 块：
#
#   location /e/hk01 {
#       proxy_pass http://127.0.0.1:20001;   # sing-box 入站
#       proxy_http_version 1.1;
#       proxy_set_header Upgrade $http_upgrade;
#       proxy_set_header Connection "upgrade";
#       proxy_set_header Host $host;
#       proxy_read_timeout 3600s;            # ← 同样必须调大
#       proxy_send_timeout 3600s;
#       proxy_buffering off;
#   }
#
# 但**不推荐**：把 API 和中转层放一起，等于把"知道服务端在哪"和
# "流量从哪出"绑在同一台机器上，被扫到就是双杀。
# ======================================================================
