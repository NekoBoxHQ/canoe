# 轻舟中转层 —— Nginx 前置配置示例
#
# 作用：在 443 上终止 TLS，把不同 WebSocket 路径反代到本机不同 sing-box 入站端口。
#
#   客户端看到的是      canoe.example.com:443 + /e/hk01
#   sing-box 实际监听   127.0.0.1:20001
#
# 这份文件可以用 /api/admin/relay/config?fmt=nginx 自动生成，
# 生成的内容与当前节点表一致，不要长期手改。

server {
    listen 443 ssl;
    http2 on;
    server_name canoe.example.com;

    ssl_certificate     /etc/letsencrypt/live/canoe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canoe.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 伪装：根路径看起来像个普通站点
    location / {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ---- 节点 1：香港 ----
    location /e/hk01 {
        proxy_pass http://127.0.0.1:20001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ⚠ 必须调大。默认 60s 会把长连接掐断，
        #   表现是"能连上但几十秒后断流"
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- 节点 2：美西 ----
    location /e/us01 {
        proxy_pass http://127.0.0.1:20002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name canoe.example.com;
    return 301 https://$host$request_uri;
}

# 后端 API（Canoe Server）。可以和上面合并，也可以分开放在另一个域名下。
server {
    listen 443 ssl;
    http2 on;
    server_name api.canoe.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.canoe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.canoe.example.com/privkey.pem;

    # 强烈建议：只允许 HTTPS，并开 HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
