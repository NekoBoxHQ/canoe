[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canoe-core"
version = "1.0.0"
description = "轻舟 / Canoe —— 客户端与服务端的公共库"
readme = "README.md"
requires-python = ">=3.10"
# cryptography 是 crypto.py（订阅加密信封）要用的 —— 客户端和服务端
# 都通过装 canoe-core 得到它，各自不用再列一遍。
dependencies = ["pydantic>=2.7,<3", "cryptography>=42,<51"]

[tool.setuptools.packages.find]
include = ["canoe_core*"]
